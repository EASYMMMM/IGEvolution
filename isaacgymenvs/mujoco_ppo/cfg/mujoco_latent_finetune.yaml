# Isaac latent -> MuJoCo fine-tuning. No supported-startup task by default.
# These are MuJoCo fine-tuning DR/rewards, not an exact PhysX DR reproduction.
model:
  checkpoint_path: checkpoints/latent/SRL_Real_Bot_latent_joint_s4_5hz_original_gait_noslip_seed45.pth
  xml_path: mjcf/srl_real_v1/srl_real_bot_v2_copy.xml

training:
  total_updates: 2000
  num_envs: 20
  env_workers: 4
  env_worker_threads: 1
  rollout_steps: 512
  training_episode_steps: 5000
  device: cuda:0
  seed: 45
  actor_input_mode: estimated
  actor_learning_rate: 5.0e-6
  actor_lr_schedule: adaptive
  actor_min_learning_rate: 1.0e-6
  actor_max_learning_rate: 2.0e-5
  critic_learning_rate: 1.0e-4
  critic_warmup_updates: 5
  estimator_only_updates: 0
  update_epochs: 5
  minibatch_size: 2048
  reward_scale: 0.01
  normalize_value: true
  clip_value: true
  target_kl: 0.006
  reference_policy_coef: 0.001
  actor_sym_loss_coef: 0.4
  bounds_loss_coef: 0.0001
  ent_coef: 0.0
  resume_optimizer: false
  save_every: 250
  save_dir: mujoco_ppo/runs/latent
  wandb_enabled: false
  wandb_project: SRL_Mujoco_Latent

encoder:
  latent_ppo_update_encoder: true
  estimator_learning_rate: 1.0e-4
  estimator_update_epochs: 4
  estimator_minibatch_size: 1024
  latent_explicit_loss_coef: 1.0
  latent_next_observation_loss_coef: 1.0
  latent_l2_loss_coef: 0.0001
  latent_aux_loss_coef: 1.0
  latent_encoder_max_grad_norm: 1.0
  latent_mirror_supervision: true
  latent_gradient_diagnostics: true
  # Freeze pretrained encoder statistics during initial adaptation.
  latent_update_normalization: false

control:
  # This XML has torque motors, not position servos.
  control_backend: torque_pd
  dof_vel_obs_scale: 0.05
  action_scale: 1.0
  episode_action_scale_range: [1.0, 1.0]
  inplace_action_scale_range: [1.0, 1.0]
  mixed_task_action_scale: 1.0
  default_dof_pos: [0, -0.55, -0.3, 0, -0.55, -0.3]
  kp: [250, 300, 300, 250, 300, 300]
  kd: [12, 14, 10, 12, 14, 10]
  effort_limits: [90, 90, 350, 90, 90, 350]
  action_filter_enable: true
  action_filter_cutoff_hz: 5.0
  action_filter_jointwise_enable: false
  preserve_xml_damping: false
  observation_delay_enable: false
  sensor_uniform_noise_enable: false

curriculum:
  task_training_stage: 3
  mixed_task_enable: false
  three_task_enable: false
  # --mixed-startup-stage3 enables the 50/50 task preset before --set overrides.
  # null preserves the inherited Stage3 initialization; the preset snapshots it.
  mixed_task_stage3_initial_pose_randomization_enable: null
  initial_pose_randomization_enable: false
  domain_randomization_enable: true
  dr_curriculum_enable: true
  dr_curriculum_initial_level: 2
  eval_during_training: true
  eval_every_updates: 250
  eval_during_training_seeds: 20
  evaluation_suite_enable: true
  # If --three-tasks is supplied, use the existing supported-startup curriculum.
  inplace_startup_initial_height_range: [0.93, 1.0]
  inplace_startup_first_target_height_range: [0.85, 0.95]
  inplace_startup_support_sync_with_height_ramp: true
  inplace_startup_randomize_height_after_unload: false

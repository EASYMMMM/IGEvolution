 # used to create the object
name: HumanoidAMPSRLGym_s1_Smpl_v2

physics_engine: ${..physics_engine}

env:
  numEnvs: ${resolve_default:4096,${...num_envs}}
  envSpacing: 5
  episodeLength: 500
  cameraFollow: True
  enableDebugVis: True
  numStateHistSteps: 5

  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 3
  stateInit: "Random"
  hybridInitProb: 0.5
  numAMPObsSteps: 2

  train_stage: 2

  localRootObs: True
  AMPlocalRootObs: True
  contactBodies: ["right_foot", "left_foot", "right_shin", "left_shin"]
  selfCollisionFilter: 1
  terminationHeight: 0.55
  enableEarlyTermination: True

  # Diagnostics are off by default and do not change simulation behavior.
  diagPrintAssetProps: False
  diagPrintRuntime: False
  diagRuntimeInterval: 20
  diagZeroAction: False
  diagPrintPrePhysicsReset: False
  diagDisableDofDrives: False

  # v2 migration switches
  humanoidDofMode: "hinge_chain"   # legacy_expmap / hinge_chain
  v2AssetExpected: False

  # action library used by MotionLibV2
  motion_file: "amp_humanoid_walk_175_v2.npy"

  # default stays on the proven legacy XML first; switch to amp_humanoid_175_v2.xml
  # after we finish hinge-chain semantics inside the v2 files.
  asset:
    assetFileName: "mjcf/amp_humanoid_175_v2.xml"
    # assetFileName: "mjcf/amp_humanoid_175_v2.xml"

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

  torque_threshold: 50
  upper_reward_w: 1
  srl_torque_reward_w: 0.001
  srl_load_cell_w: 0.00
  srl_root_force_reward_w: 0
  target_v_task: False
  autogen_model: True
  load_cell: True
  humanoid_load_cell_obs: False
  design_param_obs: False
  design_params:
    mode: mode1
    first_leg_lenth: 0.40
    first_leg_size: 0.03
    second_leg_lenth: 0.80
    second_leg_size: 0.03
    third_leg_size: 0.03
  freejoint_y: False

sim:
  dt: 0.005
  substeps: 2
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}}
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 8388608
    num_subscenes: ${....num_subscenes}
    contact_collection: 2

task:
  randomize: False
  randomization_params:
    frequency: 600
    observations:
      range: [0, .002]
      operation: "additive"
      distribution: "gaussian"
    actions:
      range: [0., .02]
      operation: "additive"
      distribution: "gaussian"
    sim_params:
      gravity:
        range: [0, 0.4]
        operation: "additive"
        distribution: "gaussian"
        schedule: "linear"
        schedule_steps: 3000
    actor_params:
      humanoid:
        color: True
        rigid_body_properties:
          mass:
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
            setup_only: True
            schedule: "linear"
            schedule_steps: 3000
        rigid_shape_properties:
          friction:
            num_buckets: 500
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"
            schedule_steps: 3000
          restitution:
            range: [0., 0.7]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"
            schedule_steps: 3000
        dof_properties:
          damping:
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"
            schedule_steps: 3000
          stiffness:
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"
            schedule_steps: 3000
          lower:
            range: [0, 0.01]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"
            schedule_steps: 3000
          upper:
            range: [0, 0.01]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"
            schedule_steps: 3000

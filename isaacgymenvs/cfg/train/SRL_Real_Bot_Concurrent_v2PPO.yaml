params:
  seed: ${...seed}

  algo:
    name: srl_bot_concurrent_v2

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False}
  load_path: ${...checkpoint}

  config:
    name: ${resolve_default:Humanoid,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3
    lr_schedule: adaptive
    kl_threshold: 0.016
    score_to_win: 9999999
    max_epochs: ${resolve_default:1000,${....max_iterations}}
    save_best_after: 200
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.01
    truncate_grads: True
    ppo: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 65536
    mini_epochs: 5
    critic_coef: 0
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001
    a_sym_loss_coef: 1.0
    c_sym_loss_coef: 0.0

    # 10 x 26 causal proprioceptive history -> [height, vx, vy, vz].
    concurrent_v2_estimator_history_len: 10
    concurrent_v2_estimator_hidden_dims: [256, 128, 64]
    concurrent_v2_estimator_learning_rate: 1e-3
    concurrent_v2_estimator_mini_epochs: 2
    concurrent_v2_estimator_minibatch_size: 8192
    concurrent_v2_estimator_samples_per_step: 256
    concurrent_v2_estimator_grad_norm: 1.0
    concurrent_v2_estimator_update_normalization: True
    concurrent_v2_estimator_temporal_loss_coef: 0.05

    # Stage 1 starts from random weights and promotes complete environments
    # from GT stacks to EST stacks. A rollout never switches mode mid-episode.
    concurrent_v2_bootstrap_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
    concurrent_v2_bootstrap_initial_level: 0
    concurrent_v2_bootstrap_auto_advance: True
    concurrent_v2_bootstrap_warmup_epochs: 300
    concurrent_v2_bootstrap_min_epochs_per_level: 100
    concurrent_v2_bootstrap_min_completed_episodes: 50
    concurrent_v2_bootstrap_metric_window: 200
    concurrent_v2_bootstrap_ground_truth_min_length: 4000.0
    concurrent_v2_bootstrap_promote_length_ratio: 0.90
    concurrent_v2_bootstrap_promote_reward_ratio: 0.85
    concurrent_v2_bootstrap_demote_length_ratio: 0.70
    concurrent_v2_bootstrap_max_normalized_mse: 0.20

    # Stage checkpoints retain the achieved EST probability. No checkpoint
    # from the old 137-D concurrent or latent systems is accepted.
    concurrent_v2_task_training_stage: ${....task.env.task_training_stage}
    concurrent_v2_bootstrap_reset_on_stage_change: False
    concurrent_v2_bootstrap_reset_on_restore: False
    concurrent_v2_bootstrap_reset_probability: 0.0
    concurrent_v2_bootstrap_clear_metrics_on_reset: True
    concurrent_v2_eval_use_estimator: True

    central_value_config:
      minibatch_size: ${..minibatch_size}
      mini_epochs: ${..mini_epochs}
      learning_rate: ${..learning_rate}
      lr_schedule: ${..lr_schedule}
      schedule_type: standard
      kl_threshold: ${..kl_threshold}
      clip_value: True
      normalize_input: True
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

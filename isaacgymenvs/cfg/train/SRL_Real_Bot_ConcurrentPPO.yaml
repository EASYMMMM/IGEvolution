params:
  seed: ${...seed}

  algo:
    name: srl_bot_concurrent

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False} # flag which sets whether to load the checkpoint
  load_path: ${...checkpoint} # path to the checkpoint to load

  config:
    name: ${resolve_default:Humanoid,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-3  # 5e-4
    lr_schedule: adaptive
    kl_threshold: 0.016 # 0.008
    score_to_win: 9999999
    max_epochs: ${resolve_default:1000,${....max_iterations}}
    save_best_after: 200
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.01 #0.01
    truncate_grads: True
    ppo: True
    e_clip: 0.2
    horizon_length: 128 #128
    minibatch_size: 65536 #65536
    mini_epochs: 5 #4
    critic_coef: 0
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001
    # sym_loss_coef
    a_sym_loss_coef: 1.0
    c_sym_loss_coef: 0.0

    # Concurrent policy/state-estimator training. The actor receives the
    # deployable 133-D observation plus one current 4-D truth/estimate slot;
    # the asymmetric critic always receives the simulator-truth 153-D state.
    concurrent_estimator_history_len: 10
    concurrent_estimator_hidden_dims: [256, 128, 64]
    concurrent_estimator_learning_rate: 1e-3
    concurrent_estimator_mini_epochs: 2
    concurrent_estimator_minibatch_size: 8192
    concurrent_estimator_samples_per_step: 256
    concurrent_estimator_grad_norm: 1.0
    concurrent_estimator_update_normalization: True

    # An episode uses either all ground-truth or all estimated state inputs.
    # Promotion is performance-gated instead of tied to a fixed epoch ramp.
    concurrent_bootstrap_levels: [0.0, 0.1, 0.25, 0.5, 0.75, 1.0]
    concurrent_bootstrap_initial_level: 0
    concurrent_bootstrap_auto_advance: True
    concurrent_bootstrap_warmup_epochs: 300
    concurrent_bootstrap_min_epochs_per_level: 100
    concurrent_bootstrap_min_completed_episodes: 50
    concurrent_bootstrap_metric_window: 200
    concurrent_bootstrap_ground_truth_min_length: 4000.0
    concurrent_bootstrap_promote_length_ratio: 0.90
    concurrent_bootstrap_promote_reward_ratio: 0.85
    concurrent_bootstrap_demote_length_ratio: 0.70
    concurrent_bootstrap_max_normalized_mse: 0.20

    # Preserve bootstrap state for ordinary same-stage resumes.  At a task-stage
    # boundary, keep the learned networks but restart the trust curriculum and
    # discard performance statistics measured under the previous task/reward.
    concurrent_task_training_stage: ${....task.env.task_training_stage}
    concurrent_bootstrap_reset_on_stage_change: True
    concurrent_bootstrap_reset_on_restore: False
    concurrent_bootstrap_reset_probability: 0.5
    concurrent_bootstrap_clear_metrics_on_reset: True

    # Dedicated concurrent-agent player evaluation.
    concurrent_eval_use_estimator: True

    central_value_config:
      minibatch_size: ${..minibatch_size}
      mini_epochs: ${..mini_epochs}
      learning_rate: ${..learning_rate}
      lr_schedule: ${..lr_schedule}
      schedule_type: standard
      kl_threshold: ${..kl_threshold}
      clip_value: True
      normalize_input: True
      truncate_grads: True

      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None
